services:
  - type: web
    name: intraday-stock-picker
    env: python
    rootDir: "Intraday Stock Picker"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANGEL_FEED_ENABLED
        value: "true"
      # You can set these secrets in the Render dashboard
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
